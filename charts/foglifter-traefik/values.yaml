---
# Recommended default FogLifter Traefik configurations

# FQDNs used to access FogLifter UI
hosts: []

# Namespace for FogLifter services
foglifterNamespace: foglifter

# Internal Traefik service FQDN
traefikService: traefik.traefik-system.svc.cluster.local

# TLS certificate configurations
certificate:
  # Use existing tls secret
  useExisting: false
  # Existing tls secret name
  name: ""

# Response security headers, applied to every HTTPS IngressRoute through a
# Traefik headers Middleware. Mirrors securityHeaders in the foglifter chart.
# Each route block (core, client, view, ...) can set securityHeaders to:
#   full   every header below (default)
#   noCsp  every header except Content-Security-Policy, leaving any CSP the
#          app sends itself untouched (X-Frame-Options still blocks framing)
#   off    no security headers on that route
securityHeaders:
  # Set to false to omit the middleware entirely
  enabled: true
  # Strip server identification headers (Server, X-Powered-By)
  removeServerHeaders: true
  # HTTP Strict Transport Security. Off by default: once a browser has seen
  # it, the host is HTTPS-only in that browser for maxAge and can't be undone
  # centrally. Roll it out deliberately, starting with a short maxAge.
  hsts:
    # Enable the Strict-Transport-Security header
    enabled: false
    # max-age directive, in seconds
    maxAge: 31536000
    # Append the includeSubDomains directive
    includeSubdomains: false
    # Append the preload directive
    preload: false
    # Send the header even when Traefik sees plain HTTP, i.e. when TLS is
    # terminated in front of Traefik
    force: false
  # X-Frame-Options value (e.g. SAMEORIGIN, DENY); set to "" to omit
  frameOptions: SAMEORIGIN
  # Content-Security-Policy frame-ancestors sources; set to [] to omit
  frameAncestors:
    - "'self'"
  # Set X-Content-Type-Options: nosniff
  contentTypeOptions: true
  # Referrer-Policy value; set to "" to omit
  referrerPolicy: strict-origin-when-cross-origin

# FogLifter core app ingress configurations
core:
  # Core app service port
  port: 8080
  # Core app service name
  name: foglifter-core-svc
  # Core app service route path
  path: /api

# FogLifter routing service ingress configurations
routing:
  # routing service service port
  port: 8080
  # routing service service name
  name: foglifter-routing-svc
  # routing service service route path
  path: /

# FogLifter apiservice ingress configurations
apiservice:
  # Apiservice service port
  port: 8080
  # Apiservice service name
  name: foglifter-apiservice-svc
  # Apiservice service route path
  path: /api/v1

# FogLifter auth service ingress configurations
auth:
  # auth service port
  port: 8080
  # auth service name
  name: foglifter-auth-svc
  # auth service route path
  path: /api/auth

# FogLifter UI client ingress configurations
client:
  # Client service port
  port: 8080
  # Client service name
  name: foglifter-client-svc
  # Client service route path
  path: /ui

# FogLifter scheduler ingress configurations
scheduler:
  # Enable scheduler ingress
  enabled: true
  # Scheduler service port
  port: 8080
  # Scheduler service name
  name: foglifter-scheduler-svc
  # Scheduler service route path
  path: /scheduler

# FogLifter compliance
compliance:
  # Enable compliance API ingress
  enabled: false
  # Compliance API service port
  port: 3000
  # Compliance API service name
  name: foglifter-compliance-api-svc
  # Compliance API service route path
  path: /api/compliance

# Argo CD ingress configurations
argocd:
  # Enable Argo CD ingress
  enabled: true
  # Argo CD service port
  port: 80
  # Argo CD server service name
  name: foglifter-argocd-server
  # Argo CD server service namespace
  namespace: foglifter-argocd
  # Argo CD route path
  path: /argo-cd

# FogLifter View ingress configurations
view:
  # Enable View ingress
  enabled: true
  # View service port
  port: 3000
  # View app service name
  name: foglifter-view-svc
  # View app service namespace
  namespace: foglifter-view
  # View app route path
  path: /dashboard/
  # Security headers on this route (full, noCsp, off). ToolJet may send its
  # own Content-Security-Policy, which the full set would replace.
  securityHeaders: noCsp

# FogLifter PGAdmin ingress configurations
pgadmin:
  # Enable PGAdmin ingress
  enabled: false
  # PGAdmin service port
  port: 5432
  # PGAdmin service name
  name: foglifter-postgres-pgadmin-svc
  # PGAdmin service namespace
  namespace: foglifter-postgres
  # PGAdmin route path
  path: /pgadmin

# MongoDB ingress configurations
mongo:
  # Enable Mongo ingress
  enabled: false
  # Mongo service port
  port: 27017
  # Mongo service name
  name: foglifter-mongo-svc
  # Mongo service namespace
  namespace: foglifter

# Postgres ingress configurations
postgres:
  # Enable Postgres ingress
  enabled: false
  # Postgres service port
  port: 5432
  # Postgres service name
  name: foglifter-postgres-svc
  # Postgres service namespace
  namespace: foglifter-postgres
