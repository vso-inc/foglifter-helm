{{- $full := false }}
{{- $noCsp := false }}
{{- range $route := splitList " " (include "traefik.shRoutes" .) }}
{{- $name := include "traefik.shMiddlewareName" (dict "root" $ "route" $route) }}
{{- if eq $name (printf "%s-security-headers" $.Release.Name) }}{{ $full = true }}{{ end }}
{{- if eq $name (printf "%s-security-headers-no-csp" $.Release.Name) }}{{ $noCsp = true }}{{ end }}
{{- end }}
{{- if $full }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-security-headers
spec:
  {{- include "traefik.securityHeadersSpec" (dict "root" . "csp" true) | nindent 2 }}
{{- end }}
{{- if $noCsp }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-security-headers-no-csp
spec:
  {{- include "traefik.securityHeadersSpec" (dict "root" . "csp" false) | nindent 2 }}
{{- end }}
