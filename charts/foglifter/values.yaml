---
# Recommended default FogLifter® configurations

# Image registry for all FogLifter® deployments
# Should end with forward-slash if set (e.g. "quay.io/")
registry: "ghcr.io/vso-inc/"
# ImagePullPolicy for all FogLifter® deployments
imagePullPolicy: IfNotPresent
# ImagePullSecret name for all FogLifter® deployments
# Must be created separately from helm install/upgrade
imagePullSecret: "foglifter-pullsecret"

# FogLifter® site domain name (e.g. "foglifter.example.com")
domain: ""

# FogLifter® internal service-mesh URL
serviceMesh:
  # Internal service-mesh domain
  domain: foglifter-traefik
  # Internal service-mesh protocol
  protocol: http
  # Internal service-mesh path
  # path: /api
  # Internal service-mesh port
  # port: 80

# FogLifter® API secret
apiSecret:
  # Create Secret
  create: false
  # API secret data
  data: {}
  #   AUTH_APIKEY: ""
  #   COMPLIANCE_APIKEY: ""
  #   CORE_APIKEY: ""
  #   EXECUTOR_APIKEY: ""
  #   SCHEDULER_APIKEY: ""
  #   SECRET_KEY: ""
  #   TOKEN_JWT_SECRET: ""
  # Existing secret name
  # Must contain above environment variables
  name: foglifter-api-secret
# Create foglifter-mongodb secret for mongodb-kubernetes if enabled
createMongoSecret: false
# FogLifter® MongoDB secret name
# Must contain MONGO_URI
# Ignored if mongob-kubernetes.enabled is true and mongoSecretOverride is false
mongoSecret: ""
# Override MongoDB secret if mongodb-kubernetes is enabled
mongoSecretOverride: false
# Generate basic-auth Secrets for CloudNativePG managed roles (see cluster.cluster.roles)
createPostgresRoleSecrets: false

# FogLifter® ConfigMap parameters
cm:
  # Create ConfigMap
  create: true
  # Environment variables to be passed to all FogLifter® deployments via ConfigMap
  data: {}
  #   ENV_VAR_NAME: value

# FogLifter® Secret parameters
secret:
  # Create Secret
  create: false
  # Environment variables to be passed to all FogLifter® deployments via Secret
  data:
  #   ENV_VAR_NAME: value

# FogLifter® PriorityClass parameters
priorityClass:
  # Create PriorityClass to resist eviction
  create: true
  # PriorityClass priority value
  value: 1000000

# FogLifter® MongoDB backups cronjob parameters
backups:
  # Enable MongoDB backups cronjob
  enabled: false
  # Cronjob schedule
  schedule: "0 0 * * *"
  # Number of backups to retain
  retain: 3
  # Backups PersistentVolumeClaim storage size
  storage: 10Gi
  # Backups PersistentVolumeClaim storage class
  storageClass: ""
  # Cronjob extra environment variables
  env:
  #   ENV_VAR_NAME: value
  # Cronjob extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Cronjob resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# FogLifter® apiservice deployment parameters
apiservice:
  # Apiservice deployment port
  port: 8080
  # Apiservice deployment replicas
  replicas: 1
  # Apiservice deployment image repository
  repository: foglifter-api-service
  # Apiservice deployment image tag
  tag: prod
  # Apiservice trust token hash key (TRUST_TOKEN_HASH_KEY)
  trustToken: ""
  # Apiservice deployment extra environment variables
  env:
    API_PREFIX: "api"
    EXCLUDE_ROUTES_FROM_LOGGING_ARRAY: |
      [
        "/api/v1/heartbeat",
        "/api/v1/health",
        "/api/v1/notification/process",
        "/api/v1/scheduler/settings"
      ]
    POSTGRES_HOST: postgresql
    POSTGRES_PORT: "5432"
    POSTGRES_DB: notifications
    POSTGRES_USER: apiservice
  # Apiservice deployment extra environment variables from existing secret
  secretRef:
    POSTGRES_PASSWORD:
      name: foglifter-pg-apiservice
      key: password
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Apiservice deployment probes
  livenessProbe:
    httpGet:
      path: /api/v1/health
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/v1/health
    initialDelaySeconds: 3
    periodSeconds: 3
  startupProbe:
    httpGet:
      path: /api/v1/health
  # Apiservice deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# FogLifter® auth deployment parameters
auth:
  # Auth deployment port
  port: 8080
  # Auth deployment replicas
  replicas: 1
  # Auth deployment image repository
  repository: foglifter-auth-service
  # Auth deployment image tag
  tag: prod
  # Auth deployment extra environment variables
  env:
    EXCLUDE_ROUTES_FROM_LOGGING_ARRAY: |
      [
        "/api/auth/system/health"
      ]
  # Auth deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Auth deployment probes
  livenessProbe:
    httpGet:
      path: /api/auth/system/health
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/auth/system/health
    initialDelaySeconds: 5
    periodSeconds: 3
  startupProbe:
    httpGet:
      path: /api/auth/system/health
  # Auth deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# FogLifter® UI client deployment parameters
client:
  # Enable client deployment
  enabled: true
  # Client deployment port
  port: 3000
  # Client deployment replicas
  replicas: 1
  # Client deployment image repository
  repository: foglifter-client
  # Client deployment image tag
  tag: prod
  # Client deployment extra environment variables
  env:
  #   ENV_VAR_NAME: value
  # Client deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Client deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Client deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# FogLifter® compliance parameters
compliance:
  # Enable compliance API
  enabled: false
  # Compliance API deployment port
  port: 3000
  # Compliance API deployment replicas
  replicas: 1
  # Compliance API deployment image repository
  repository: foglifter-compliance-api
  # Compliance API deployment image tag
  tag: prod
  # Compliance API deployment secret parameters
  secret:
    # Create Secret
    create: true
    # DB_PASSWORD
    password: ""
    # DB_URL
    url: ""
    # Existing secret name
    # Must contain above environment variables
    name: ""
  # Compliance API deployment extra environment variables
  env:
    BCRYPT_SALT: "10"
    JWT_EXPIRATION: 2d
  # Compliance API deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Compliance API deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Compliance API deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

mssql:
  # Deploy an MSSQL instance for compliance
  enabled: false
  # Values to be passed to mssql helm chart
  # https://gitlab.com/xrow-public/helm-mssql/-/blob/1.0.3/chart/README.md
  # https://gitlab.com/xrow-public/helm-mssql/-/blob/1.0.3/chart/values.yaml
  fullnameOverride: foglifter-compliance-mssql
  auth:
    database: FogLifter_Compliance
    rootPassword: ""
    username: foglifter
    password: ""
    existingSecret: ""

# FogLifter® core deployment parameters
core:
  # Core deployment port
  port: 8080
  # Core deployment replicas
  replicas: 1
  # Core deployment image repository
  repository: foglifter-core-app
  # Core deployment image tag
  tag: prod
  # Core deployment extra environment variables
  env:
  #   ENV_VAR_NAME: value
  # Core deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Core deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Core deployment resources
  resources:
  #   requests:
  #     cpu: 1000m
  #     memory: 2048Mi
  #   limits:
  #     cpu: 4000m
  #     memory: 8192Mi

# FogLifter® exec deployment parameters
exec:
  # Exec deployment image repository
  repository: foglifter-exec-app
  # Exec deployment image tag
  tag: prod
  # Exec deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Enable replication which splits exec app into multiple deployments based on job queue(s)
  replication: false
  # Shared/default values for all exec deployments
  defaults:
    # Exec deployment podAntiAffinity
    antiAffinity:
      # Anti-affinity between replicas of the same deployment
      self: true
      # Custom pod anti-affinity rules
      custom:
      #   - key: "name"
      #     operator: "In"
      #     values:
      #     - "mongodb"
    # Exec deployment nodeSelector
    nodeSelector: {}
    # Exec deployment tolerations
    tolerations: {}
    # Exec deployment extra environment variables
    env:
      NODE_OPTIONS: "--experimental-vm-modules"
    # Exec deployment extra environment variables from existing secret
    secretRef:
    #   ENV_VAR_NAME:
    #     name: secret-name
    #     key: secret_key
    # Exec deployment resources - default
    resources:
    #   requests:
    #     cpu: 2000m
    #     memory: 4096Mi
    #   limits:
    #     cpu: 4000m
    #     memory: 8192Mi
  # Exec deployments configurations if replication is true
  # Each entry defines a separate deployment for the specified execution queue(s)
  # Defaults to a standard and system deployment, but can be customized as needed
  deployments:
    standard:
      replicas: 1
      queues:
        - standard
      # antiAffinity:
      #   custom: {}
      # nodeSelector: {}
      # tolerations: {}
      env:
        CONCURRENT_JOBS: 1
        NODE_OPTIONS: "--experimental-vm-modules"
      # secretRef: {}
      # resources: {}
    system:
      replicas: 1
      queues:
        - system
        # - compliance
      # antiAffinity:
      #   custom: {}
      # nodeSelector: {}
      # tolerations: {}
      env:
        CONCURRENT_JOBS: 5
        NODE_OPTIONS: "--experimental-vm-modules"
      # secretRef: {}
      # resources:
      #   requests:
      #     cpu: 250m
      #     memory: 2048Mi
      #   limits:
      #     cpu: 1000m
      #     memory: 2048Mi
    # Custom deployments can be added in the same format as above
    # compliance:
    #   replicas: 1
    #   queues:
    #     - compliance
    #   antiAffinity:
    #     custom: {}
    #   env:
    #     CONCURRENT_JOBS: 5
    #     NODE_OPTIONS: "--experimental-vm-modules"
    #   secretRef: {}
    #   resources: {}

# FogLifter® notification server deployment parameters
notification:
  # Enable notification server deployment
  enabled: true
  # Notification server replicas
  replicas: 1
  # Notification server image repository
  repository: foglifter-notification-server
  # Notification server image tag
  tag: prod
  # Notification server extra environment variables
  env:
    LOG_LEVEL: info
    POSTGRES_HOST: postgresql
    POSTGRES_PORT: "5432"
    POSTGRES_DB: notifications
    POSTGRES_USER: notifications
    QUEUE_TEAM_SIZE: "10"
    # SMTP is required for delivery; unset defaults to a no-op localhost relay
    # NOTIFICATION_SMTP_SERVER: smtp.example.com
    # NOTIFICATION_SMTP_PORT: "587"
    # NOTIFICATION_SMTP_TLS: "true"
    # NOTIFICATION_EMAIL_FROM: noreply@foglifter.example.com
  # Notification server extra environment variables from existing secret
  secretRef:
    POSTGRES_PASSWORD:
      name: foglifter-pg-notifications
      key: password
  #   NOTIFICATION_SMTP_PASSWORD:
  #     name: secret-name
  #     key: secret_key
  #   TELEGRAM_BOT_TOKEN:
  #     name: secret-name
  #     key: secret_key
  # Notification server probes
  livenessProbe: {}
  #   exec:
  #     command: ["node", "apps/server/dist/bin/notify.js", "queue:probe"]
  #   initialDelaySeconds: 30
  #   periodSeconds: 60
  readinessProbe: {}
  # Notification server resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# FogLifter® routing service deployment parameters
routing:
  # Enable routing service deployment
  enabled: true
  # Routing service deployment port
  port: 8080
  # Routing service deployment replicas
  replicas: 1
  # Routing service deployment image repository
  repository: foglifter-routing-service
  # Routing service deployment image tag
  tag: prod
  # Routing service deployment extra environment variables
  env:
  #   ENV_VAR_NAME: value
  # Routing service deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Routing service deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Routing service deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

scheduler:
  # Enable scheduler deployment
  enabled: true
  # Scheduler deployment port
  port: 8080
  # Scheduler deployment replicas
  replicas: 1
  # Scheduler deployment image repository
  repository: foglifter-scheduler
  # Scheduler deployment image tag
  tag: prod
  # Scheduler deployment extra environment variables
  env:
    EXPRESS_JSON_SIZE_LIMIT: 10mb
    LOG_LEVEL: info
    SCHEDULER_HEARTBEAT_INTERVAL: 60000
    SCHEDULER_AUTH_INTERVAL: 10000
    SCHEDULER_SETTINGS_INTERVAL: 15000
  # Scheduler deployment extra environment variables from existing secret
  secretRef:
  #   ENV_VAR_NAME:
  #     name: secret-name
  #     key: secret_key
  # Scheduler deployment probes
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  # Scheduler deployment resources
  resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 2048Mi

# Out-of-band Secret holding AI-provider keys for the agents (OPENAI_API_KEY /
# ANTHROPIC_API_KEY / AZURE_OPENAI_API_KEY ...). Created separately; consumed via
# envFrom (optional) by nlqAgent and assistant. Never rendered by this chart.
agentSecretName: foglifter-agent-secret

# FogLifter® NLQ context server — opt-in addon
nlqServer:
  enabled: false
  port: 8080
  replicas: 1
  repository: foglifter-nlq-server
  tag: prod
  env:
    API_PREFIX: api/ai/nlq/context
    API_PREFIX_SWAGGER: api/ai/nlq
  secretRef:
  livenessProbe:
    httpGet:
      path: /api/ai/nlq/context/health
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /api/ai/nlq/context/health
    initialDelaySeconds: 3
    periodSeconds: 3
  startupProbe:
    httpGet:
      path: /api/ai/nlq/context/health
  resources:

# FogLifter® NLQ agent — opt-in addon
nlqAgent:
  enabled: false
  # App default is 3142; forced to 8000 to match the Service/route backend
  port: 8000
  replicas: 1
  repository: foglifter-agents/foglifter-nlq-agent
  tag: prod
  # Postgres role/db; the role password Secret is minted by postgres-role-secrets.yaml
  postgres:
    name: DATABASE_URI
    host: postgresql
    port: 5432
    db: nlq
    user: nlq
    secret:
      name: foglifter-pg-nlq
      key: password
  env:
    NODE_ENV: production
    MEMORY_STORAGE: postgres
    AGENT_GUARD_READONLY: "false"
    AGENT_GUARD_LIMIT_INJECT: "false"
    AGENT_GUARD_LIMIT_DEFAULT: "1000"
    AGENT_MAX_STEPS: "75"
    MODEL_PROVIDER: azure
    MODEL_NAME: gpt-4o
  secretRef:
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  resources:

# FogLifter® Assistant (Buddy) agent — opt-in addon
assistant:
  enabled: false
  port: 3141
  replicas: 1
  # Note the nested repository path under the vso registry
  repository: foglifter-agents/foglifter-assistant-agent
  tag: prod
  postgres:
    name: DATABASE_URI
    host: postgresql
    port: 5432
    db: agent_assistant
    user: agent_assistant
    secret:
      name: foglifter-pg-agent-assistant
      key: password
  env:
    NODE_ENV: production
    MEMORY_STORAGE: postgres
    MODEL_PROVIDER: azure
    MODEL_NAME: gpt-4o
  secretRef:
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  resources:

# FogHorn read-only query API
foghorn:
  enabled: false
  port: 3000
  replicas: 1
  # Upstream image on Docker Hub; empty registry bypasses the global vso registry
  registry: ""
  repository: postgrest/postgrest
  tag: v14.15
  # Read path (password-free DSN; libpq reads PGPASSWORD from the role secret).
  # statementTimeout rides the connection string so no role-level GUC is needed.
  postgres:
    host: postgresql
    port: 5432
    db: foghorn
    user: foghorn_readonly
    statementTimeout: 30s
    secret:
      name: foglifter-pg-foghorn-readonly
      key: password
  # Idempotent grants/default-privileges the CNPG CRs cannot express
  bootstrap:
    enabled: true
    image: ghcr.io/cloudnative-pg/postgresql:16
    ownerSecret: foglifter-pg-foghorn-etl
  env:
    PGRST_DB_SCHEMAS: api
    PGRST_DB_EXTRA_SEARCH_PATH: ""
    PGRST_DB_AGGREGATES_ENABLED: "true"
    PGRST_DB_ANON_ROLE: foghorn_anon
    PGRST_OPENAPI_MODE: ignore-privileges
  secretRef:
  resources:

# Traefik ingress controller parameters
traefik:
  # Enable Traefik as an ingress controller
  enabled: true
  # Values to be passed to traefik helm chart
  # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  fullnameOverride: foglifter-traefik
  gateway:
    enabled: false
  ingressClass:
    enabled: false
  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true

# Gateway API configurations
gatewayAPI:
  # Enable Gateway API resources
  enabled: true
  # Gateway resource configuration
  gateway:
    # Gateway name
    name: foglifter-gateway
    # Gateway namespace
    namespace: ""
    # Gateway controller name
    gatewayClassName: traefik
    # Gateway listeners configuration
    listeners:
      http:
        enabled: true
        # Default Traefik HTTP entrypoint port is 8000,
        # but will be exposed on port 80
        port: 8000
      https:
        enabled: false
        # Default Traefik HTTPS entrypoint port is 8443,
        # but will be exposed on port 443
        port: 8443
        tls:
          mode: Terminate
          certificateRefs:
            - group: ''
              kind: Secret
              name: foglifter-tls
      extra: {}
        # - name: mongo
        #   protocol: TCP
        #   port: 27017
    # Gateway annotations
    annotations: {}
  # HTTPRoute resource configuration
  httpRoute:
    # Enable HTTPRoute creation
    enabled: true
    # HTTPRoute name
    name: foglifter-routes
    # HTTPRoute namespace
    namespace: ""
    # HTTPRoute hostnames for routing
    # Can be used to route specific hostnames to the foglifter services
    hostnames: []
    # HTTPRoute annotations
    annotations: {}
    # HTTPRoute redirect HTTP to HTTPS if https listener is enabled
    httpsRedirect: true
    # Service routes. List order is the rule order in the rendered HTTPRoutes.
    # Each entry: name (the service's values key); path; and optionally
    #   service        backend Service name (defaults to name)
    #   port           backend port (defaults to .Values.<name>.port)
    #   enabled        render this route (default true)
    #   enabledKey     also require .Values.<key>.enabled
    #   listeners      which HTTPRoutes it appears in (default [http, https, internal])
    #   urlRewrite     {replacePrefix: /} to strip the path prefix before the backend
    routes:
      - name: apiservice
        path: /api/v1
      - name: auth
        path: /api/auth
      - name: client
        path: /ui
        enabledKey: client
      - name: compliance
        path: /api/compliance
        enabledKey: compliance
      - name: core
        path: /api
      - name: routing
        path: /
        enabledKey: routing
      - name: scheduler
        path: /scheduler
        enabledKey: scheduler
      # Addon-service routes
      - name: nlqServer
        service: nlq-server
        path: /api/ai/nlq
        enabledKey: nlqServer
      - name: nlqAgent
        service: nlq-agent
        path: /ai/agent
        enabledKey: nlqAgent
        urlRewrite:
          replacePrefix: /
      - name: assistant
        service: assistant
        path: /ai/agents/assistant
        enabledKey: assistant
        urlRewrite:
          replacePrefix: /
      - name: foghorn
        service: foghorn
        path: /api/query
        enabledKey: foghorn
        urlRewrite:
          replacePrefix: /

# FogLifter® ingress configurations
ingress:
  # Enable ingress
  enabled: false
  # Ingress class name
  class: ""
  # Ingress hostnames
  host: ""
  # Ingress TLS configurations
  tls:
    # Enable TLS
    enabled: false
    # Secret name for TLS certificate
    secret: ""
  # Ingress annotations
  annotations: {}

# FogLifter® service configurations
service:
  # Service type (ClusterIP, NodePort, LoadBalancer, etc.)
  type: ClusterIP
  # Service annotations
  annotations: {}

# Default pod options for all FogLifter® deployments
podOptions:
  # Node selector for pod scheduling
  nodeSelector: {}
  # Tolerations for pod scheduling
  tolerations: []
  # Labels to be added to all pods
  labels: {}
  # Annotations to be added to all pods
  annotations: {}

# CloudNative-PG operator parameters
cloudnative-pg:
  # Enable CloudNative-PG operator
  enabled: true
  # Values to be passed to CloudNative-PG helm chart
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cloudnative-pg/values.yaml
  config:
    clusterWide: false

# CloudNative-PG cluster parameters
cluster:
  # Enable CloudNative-PG cluster
  enabled: true
  # Values to be passed to CloudNative-PG cluster helm chart
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/values.yaml
  fullnameOverride: postgresql-1
  version:
    postgresql: "16"
    mode: standalone
  cluster:
    instances: 1
    storage:
      size: 10Gi
      storageClass: ""
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgresql
            spec:
              type: ClusterIP
          updateStrategy: patch
    affinity:
      topologyKey: kubernetes.io/hostname
    roles:
      - name: notifications
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        passwordSecret:
          name: foglifter-pg-notifications
      - name: apiservice
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        inRoles:
          - notifications
        passwordSecret:
          name: foglifter-pg-apiservice
      - name: nlq
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        passwordSecret:
          name: foglifter-pg-nlq
      - name: agent_assistant
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        passwordSecret:
          name: foglifter-pg-agent-assistant
      - name: foghorn_etl
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        passwordSecret:
          name: foglifter-pg-foghorn-etl
      - name: foghorn_anon
        ensure: present
        connectionLimit: -1
        inherit: true
        login: false
        superuser: false
        disablePassword: true
      - name: foghorn_readonly
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: false
        # == GRANT foghorn_anon TO foghorn_readonly
        inRoles:
          - foghorn_anon
        passwordSecret:
          name: foglifter-pg-foghorn-readonly
    initdb: {}
  databases:
    - name: notifications
      owner: notifications
    - name: nlq
      owner: nlq
    - name: agent_assistant
      owner: agent_assistant
    - name: foghorn
      owner: foghorn_etl
      # Schema created by the Database CR; grants applied by the foghorn initdb Job
      schemas:
        - name: api
          owner: foghorn_etl

# MongoDB Kubernetes Operator parameters
mongodb-kubernetes:
  # Enable MongoDB Kubernetes Operator
  # If enabled, the secret defined in passwordSecretRef.name must be created separately, and passwordSecretRef.key must be set to the password key in that secret
  # See https://github.com/mongodb/mongodb-kubernetes/blob/master/docs/mongodbcommunity/users.md
  enabled: true
  # Values to be passed to mongodb-kubernetes helm chart
  # https://github.com/mongodb/mongodb-kubernetes/blob/master/helm_chart/values.yaml
  community:
    mongodb:
      repo: quay.io/mongodb
      name: mongodb-community-server
      imageType: ubi8
    resource:
      name: foglifter-mongodb
      version: 7.0.37
      # Increase to 3 or more members for production deployments
      members: 1
      users:
        - name: foglifter
          db: foglifterDB
          passwordSecretRef:
            name: foglifter-mongodb
            key: password
          roles:
            - name: dbOwner
              db: foglifterDB
          scramCredentialsSecretName: foglifter-mongodb
      # StatefulSet API configurations
      # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
      statefulSet:
        spec:
          volumeClaimTemplates:
            - metadata:
                name: data-volume
              spec:
                # storageClassName: ""
                resources:
                  requests:
                    storage: 10Gi
            - metadata:
                name: logs-volume
              spec:
                # storageClassName: ""
                resources:
                  requests:
                    storage: 10Gi
