{{- $vol := printf "- name: config-volume\n  configMap:\n    name: %s-cm" .Release.Name }}
{{- $volMount := "- name: config-volume\n  mountPath: /etc/config\n  readOnly: true" }}
{{- include "foglifter.deployment" (dict
    "root" . "name" "core" "svc" .Values.core "container" "core-app"
    "port" (.Values.core.port | int) "portEnv" true "mongoUri" true
    "apiKeyEnv" "CORE_APIKEY" "jwtSecret" true "startupProbe" true
    "volumes" $vol "volumeMounts" $volMount) }}
