{{- $trust := .Values.auth.trustToken | default .Values.apiservice.trustToken }}
{{- include "foglifter.deployment" (dict
    "root" . "name" "auth" "svc" .Values.auth "container" "auth-app"
    "port" (.Values.auth.port | int) "portEnv" true "mongoUri" true
    "apiKeyEnv" "AUTH_APIKEY" "jwtSecret" true "startupProbe" true
    "trustTokenValue" $trust) }}
