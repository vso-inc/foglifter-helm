{{- if .Values.nlqServer.enabled }}
{{- /* FogHorn Insights MCP (/mcp), nlq-server's only endpoint, reads FogHorn as the read-only role
       PostgREST uses; its grants come from the foghorn initdb Job. nlq-server exits at startup without
       FOGHORN_QUERY_POSTGRES_URI, so refuse to render rather than deploy a crash loop. */}}
{{- if not (and .Values.foghorn.enabled .Values.cluster.enabled) }}
{{- fail "nlqServer.enabled requires foghorn.enabled and cluster.enabled: nlq-server needs the read-only FogHorn credential (FOGHORN_QUERY_POSTGRES_URI) to start" }}
{{- end }}
{{- $foghornQuery := merge (dict "name" "FOGHORN_QUERY_POSTGRES_URI") (pick .Values.foghorn.postgres "host" "port" "db" "user" "secret") }}
{{- include "foglifter.deployment" (dict
    "root" . "name" "nlq-server" "svc" .Values.nlqServer "container" "nlq-server"
    "port" (.Values.nlqServer.port | int) "portEnv" true "mongoUri" true
    "jwtSecret" true "postgres" $foghornQuery "startupProbe" true) }}
{{- end }}
